[workspace]
members = ["slint-terminal"]

[workspace.package]
authors = ["Mitchel Stewart <quackdoctech@gmail.com>"]
edition = "2024"

[workspace.dependencies]
# pin for exit fix https://github.com/slint-ui/slint/pull/14473
slint = { git = "https://github.com/slint-ui/slint", rev = "aebde6bc88392c4dd43a7661e74a4c6aa04cfd9e", default-features = false }
slint-build = { git = "https://github.com/slint-ui/slint", rev = "aebde6bc88392c4dd43a7661e74a4c6aa04cfd9e", features = ["experimental-module-builds"] }
log = "0.4"

[package]
name = "slintcon"
version = "0.1.0"
description = "A Slint-based terminal emulator for Linux VT (KMS/fbdev) and windowed use"
license = "GPL-3.0-only"
readme = "readme.md"
keywords = ["terminal", "slint", "kms", "framebuffer"]
categories = ["command-line-utilities"]
publish = false
authors.workspace = true
edition.workspace = true

[dependencies]
slint-terminal = { path = "slint-terminal" }
slint = { workspace = true, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "backend-winit-wayland",
    "backend-winit-x11",
    "backend-linuxkms",
    "backend-linuxkms-libinput",
    "renderer-software",
    "unstable-libinput-09",
] }
log.workspace = true
env_logger = "0.11"
input = "0.10"
libc = "0.2"
drm-ffi = "0.9"
procfs = { version = "0.18", default-features = false }
rustix = { version = "1", features = ["fs", "process", "termios", "std"] }
signal-hook = "0.4"

[features]
default = ["wgpu"]
# GPU terminal renderer + Slint's wgpu/Skia renderer.
wgpu = ["slint-terminal/wgpu", "slint/renderer-skia", "slint/unstable-wgpu-30"]
# Embed Iosevka Term SS12 (~10 MB). Off by default.
bundled-font = ["slint-terminal/bundled-font"]

[build-dependencies]
slint-build.workspace = true

# Smallest binary: `cargo build --profile distribution`.
[profile.distribution]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
